name: Build Custom Cashew APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Unlock Cashew Pro & Fixed Signing
        working-directory: ./budget
        run: |
          rm -f android/app/debug.keystore
          keytool -genkey -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          keytool -list -v -keystore android/app/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep SHA1
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' android/app/build.gradle
          sed -i 's/appStateSettings\["purchased"\] == true/true/g' lib/pages/premiumPage.dart
          sed -i 's/appStateSettings\["purchased"\] = false/appStateSettings\["purchased"\] = true/g' lib/pages/premiumPage.dart
          sed -i 's/"purchased": false/"purchased": true/g' lib/struct/defaultPreferences.dart

      - name: Install dependencies
        working-directory: ./budget
        run: flutter pub get

      - name: Build APK (Release)
        working-directory: ./budget
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cashew-1Money-Pro-Edition
          path: budget/build/app/outputs/flutter-apk/app-release.apk
