name: Build Cashew 1Money APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter 3.19.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      # Never generate a new signing key during a build. A new certificate must
      # first be registered in Firebase/Google Cloud, or Google login fails (10).
      - name: Test Google Sign-In configuration validator
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Check Google Sign-In certificate registration
        id: google_sign_in
        continue-on-error: true
        run: python3 scripts/validate_android_google_sign_in.py

      - name: Get Flutter Dependencies
        working-directory: budget
        run: flutter pub get

      - name: Build Release APK
        working-directory: budget
        run: flutter build apk --release --no-tree-shake-icons

      - name: Verify APK signing certificate
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs budget/build/app/outputs/flutter-apk/app-release.apk > apk-certificate.txt
          cat apk-certificate.txt
          # apksigner versions use different signer prefixes (e.g. "V2 Signer:").
          # Deduplicate the same certificate reported for multiple schemes.
          APK_SHA1=$(sed -n 's/^.*certificate SHA-1 digest: //p' apk-certificate.txt | tr '[:upper:]' '[:lower:]' | sort -u)
          KEY_SHA1=$(keytool -exportcert -keystore budget/android/app/debug.keystore -alias androiddebugkey -storepass android | sha1sum | cut -d ' ' -f 1)
          test -n "$APK_SHA1" && test "$APK_SHA1" = "$KEY_SHA1"

      - name: Require matching Google OAuth configuration before distributing APK
        if: steps.google_sign_in.outcome != 'success'
        run: |
          echo "::error::The APK compiled, but Google Sign-In configuration is invalid. Follow docs/android-google-sign-in.md before distributing it."
          exit 1

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cashew-1Money-Release-APK
          path: budget/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

